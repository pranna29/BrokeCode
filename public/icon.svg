<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="anomalyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#3730a3" stroke-width="4" stroke-opacity="0.4" />

  <!-- Grid lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="80" y1="200" x2="432" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Normal Spending Baseline Ribbon -->
  <path d="M 80,330 Q 150,310 210,325 T 320,315 T 432,320" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Dynamic Spike / Anomaly Signal Path -->
  <path d="M 80,340 L 140,320 L 190,330 L 250,140 L 310,310 L 370,300 L 432,315" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Normal points -->
  <circle cx="140" cy="320" r="8" fill="#6366f1" />
  <circle cx="190" cy="330" r="8" fill="#6366f1" />
  <circle cx="310" cy="310" r="8" fill="#6366f1" />
  <circle cx="370" cy="300" r="8" fill="#6366f1" />

  <!-- Outlier / Anomaly Ping Node -->
  <circle cx="250" cy="140" r="32" fill="url(#anomalyGrad)" opacity="0.25">
    <animate attributeName="r" values="24;36;24" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="140" r="18" fill="url(#anomalyGrad)" stroke="#ffffff" stroke-width="4" />
  
  <!-- Exclamation / Code symbol inside beacon -->
  <text x="250" y="146" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">!</text>

  <!-- Currency / Code Badge at bottom -->
  <g transform="translate(186, 390)">
    <rect width="140" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="70" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#38bdf8" text-anchor="middle" letter-spacing="2">BROKE</text>
  </g>
</svg>
